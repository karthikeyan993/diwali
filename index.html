<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0620">
  <meta name="description" content="A Diwali surprise for Dishanth and Pravya">
  <title>Happy Diwali</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪔</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;800&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Sky decoration (stars + marigold garland) -->
  <div id="world" aria-hidden="true">
    <div class="beams"><i class="beam b1"></i><i class="beam b2"></i><i class="beam b3"></i></div>
    <div id="bokeh"></div>
    <div id="stars"></div>
    <div id="skyline"></div>
    <svg id="garland" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="mg1" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffe08a"/><stop offset=".6" stop-color="#ffb703"/><stop offset="1" stop-color="#d98200"/></radialGradient>
        <radialGradient id="mg2" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffc07a"/><stop offset=".6" stop-color="#fb8500"/><stop offset="1" stop-color="#c25a00"/></radialGradient>
      </defs>
      <g id="garland-g"></g>
    </svg>
  </div>

  <!-- WebGL fireworks (PixiJS) -->
  <div id="fx"></div>

  <button class="sound" id="sound" aria-label="Mute sound" aria-pressed="false">🔊</button>

  <main>
    <section id="chooser" class="screen">
      <p class="eyebrow"><span>✦</span> Diwali 2026 <span>✦</span></p>
      <h1 class="title">Who are you?</h1>
      <p class="hint">Pick your name to light up the sky</p>
      <div class="players">
        <button class="player" data-name="Dishanth" style="--n:0;--c1:#3be8ff;--c2:#7b5cff">
          <span class="p-orb" aria-hidden="true"><span class="p-ring"></span><b>D</b></span>
          <span class="p-text"><span class="p-name">Dishanth</span><span class="p-sub" aria-hidden="true">Player 1 · Tap to launch</span></span>
          <span class="p-go" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>
        <button class="player" data-name="Pravya" style="--n:1;--c1:#ffcf6b;--c2:#ff4f9a">
          <span class="p-orb" aria-hidden="true"><span class="p-ring"></span><b>P</b></span>
          <span class="p-text"><span class="p-name">Pravya</span><span class="p-sub" aria-hidden="true">Player 2 · Tap to launch</span></span>
          <span class="p-go" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>
      </div>
    </section>

    <section id="greet" class="screen hidden" aria-live="polite">
      <div class="g-diya" aria-hidden="true">🪔</div>
      <p class="g-top" id="g-top"></p>
      <h2 class="g-name" id="g-name"></h2>
      <p class="g-msg reveal">May your Diwali sparkle with light, laughter &amp; lots of sweets!</p>
      <p class="g-hint reveal" id="g-hint">&nbsp;</p>
      <button class="again reveal" id="again">↺ Choose again</button>
    </section>
  </main>

  <!-- Diyas: decoration on the first screen, a mini-game after the greeting -->
  <div class="diyas" id="diyas">
    <button class="diya-btn" aria-label="Light diya 1"><span class="halo"></span><span class="flame-wrap"><i class="flame" style="--d:0s"></i></span><span class="diya"></span></button>
    <button class="diya-btn" aria-label="Light diya 2"><span class="halo"></span><span class="flame-wrap"><i class="flame" style="--d:-.4s"></i></span><span class="diya"></span></button>
    <button class="diya-btn" aria-label="Light diya 3"><span class="halo"></span><span class="flame-wrap"><i class="flame" style="--d:-.9s"></i></span><span class="diya"></span></button>
    <button class="diya-btn" aria-label="Light diya 4"><span class="halo"></span><span class="flame-wrap"><i class="flame" style="--d:-.2s"></i></span><span class="diya"></span></button>
    <button class="diya-btn" aria-label="Light diya 5"><span class="halo"></span><span class="flame-wrap"><i class="flame" style="--d:-.7s"></i></span><span class="diya"></span></button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
