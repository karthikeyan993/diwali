<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0620">
  <meta name="description" content="A Diwali surprise for Dishanth and Pravya">
  <title>Happy Diwali</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪔</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;800&family=Outfit:wght@400;500;600&family=Yatra+One&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Sky: one canvas for beams/bokeh/stars, then the Chennai skyline and the mango-leaf toran -->
  <div id="world" aria-hidden="true">
    <canvas id="sky"></canvas>
    <div id="skyline"></div>
    <div id="shore"></div>
    <div id="toran"></div>
    <!-- the city starts in darkness; lighting the rocket lifts this veil -->
    <div id="veil"></div>
  </div>

  <!-- WebGL fireworks (PixiJS) -->
  <div id="fx"></div>

  <button class="sound" id="sound" aria-label="Mute sound" aria-pressed="false">🔊</button>

  <main>
    <section id="chooser" class="screen">
      <h1 class="title" id="title">Who are you?</h1>
      <div class="players">
        <button class="player" data-name="Dishanth" style="--n:0;--silk:#0f7b83;--silk2:#073b47;--c1:#ffd166;--c2:#2ee6d6">
          <span class="p-diya" aria-hidden="true"><i class="p-flame"></i><i class="p-bowl"></i></span>
          <span class="p-text"><span class="p-name">Dishanth</span><span class="p-sub" aria-hidden="true">Tap to light the sky</span></span>
          <span class="p-go" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>
        <button class="player" data-name="Pravya" style="--n:1;--silk:#b0175a;--silk2:#5a0830;--c1:#ffd166;--c2:#ff5fa8">
          <span class="p-diya" aria-hidden="true"><i class="p-flame"></i><i class="p-bowl"></i></span>
          <span class="p-text"><span class="p-name">Pravya</span><span class="p-sub" aria-hidden="true">Tap to light the sky</span></span>
          <span class="p-go" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>
      </div>
    </section>

    <section id="greet" class="screen hidden" aria-live="polite">
      <div class="score reveal" id="score" aria-label="Crackers burst"><span>🧨</span> <b id="score-n">0</b></div>
      <p class="g-top" id="g-top"></p>
      <h2 class="g-name" id="g-name"></h2>
      <p class="g-hint reveal" id="g-hint">&nbsp;</p>
      <!-- Diya mini-game -->

      <div class="diyas reveal" id="diyas">
        <button class="diya-btn" aria-label="Light diya 1"><span class="halo"></span><span class="flame-wrap"><i class="flame" style="--d:0s"></i></span><svg class="diya" viewBox="0 0 56 30" aria-hidden="true"><ellipse cx="26" cy="28.6" rx="20" ry="1.5" fill="#000" opacity=".35"/><path d="M3 12Q3.5 26 24 27.6Q40 28.3 47.5 18.6L55 8.6Q46.5 12.8 38.5 12Z" fill="url(#diyaClay)"/><path d="M5 16Q8 25 24 26.4Q38 27 45 19" fill="none" stroke="#5a1f08" stroke-width="1" opacity=".45"/><path d="M7 17.6Q22 23.2 41 17.2" fill="none" stroke="#ffd166" stroke-width="1"/><circle cx="8.7" cy="18.2" r="0.8" fill="#ffd166"/><circle cx="12.1" cy="19.1" r="1.05" fill="#fff3d6"/><circle cx="15.6" cy="19.8" r="0.8" fill="#ffd166"/><circle cx="19.3" cy="20.2" r="1.05" fill="#fff3d6"/><circle cx="23.0" cy="20.3" r="0.8" fill="#ffd166"/><circle cx="26.8" cy="20.1" r="1.05" fill="#fff3d6"/><circle cx="30.8" cy="19.6" r="0.8" fill="#ffd166"/><circle cx="34.8" cy="18.9" r="1.05" fill="#fff3d6"/><circle cx="38.9" cy="17.8" r="0.8" fill="#ffd166"/><path d="M8.5 20.6L11.6 22.8L14.7 20.7L17.8 23.1L20.9 21.0L24.0 23.2L27.1 21.1L30.2 23.3L33.3 21.1L36.4 23.3L39.5 21.1" fill="none" stroke="#c81e36" stroke-width=".9" stroke-linejoin="round"/><ellipse cx="21" cy="12" rx="18" ry="3.9" fill="url(#diyaRim)"/><ellipse cx="21" cy="12.4" rx="15.4" ry="2.6" fill="#3a1305"/><ellipse cx="16" cy="11.9" rx="5" ry=".8" fill="#ffcc80" opacity=".35"/><path d="M43.5 12.8Q48.5 11.2 52.4 9.3" stroke="#2a1206" stroke-width="1.7" stroke-linecap="round"/><circle cx="52.6" cy="9.2" r="1" fill="#ffb347"/></svg></button>

        <button class="diya-btn" aria-label="Light diya 3"><span class="halo"></span><span class="flame-wrap"><i class="flame" style="--d:-.9s"></i></span><svg class="diya" viewBox="0 0 56 30" aria-hidden="true"><ellipse cx="26" cy="28.6" rx="20" ry="1.5" fill="#000" opacity=".35"/><path d="M3 12Q3.5 26 24 27.6Q40 28.3 47.5 18.6L55 8.6Q46.5 12.8 38.5 12Z" fill="url(#diyaClay)"/><path d="M5 16Q8 25 24 26.4Q38 27 45 19" fill="none" stroke="#5a1f08" stroke-width="1" opacity=".45"/><path d="M7 17.6Q22 23.2 41 17.2" fill="none" stroke="#ffd166" stroke-width="1"/><circle cx="8.7" cy="18.2" r="0.8" fill="#ffd166"/><circle cx="12.1" cy="19.1" r="1.05" fill="#fff3d6"/><circle cx="15.6" cy="19.8" r="0.8" fill="#ffd166"/><circle cx="19.3" cy="20.2" r="1.05" fill="#fff3d6"/><circle cx="23.0" cy="20.3" r="0.8" fill="#ffd166"/><circle cx="26.8" cy="20.1" r="1.05" fill="#fff3d6"/><circle cx="30.8" cy="19.6" r="0.8" fill="#ffd166"/><circle cx="34.8" cy="18.9" r="1.05" fill="#fff3d6"/><circle cx="38.9" cy="17.8" r="0.8" fill="#ffd166"/><path d="M8.5 20.6L11.6 22.8L14.7 20.7L17.8 23.1L20.9 21.0L24.0 23.2L27.1 21.1L30.2 23.3L33.3 21.1L36.4 23.3L39.5 21.1" fill="none" stroke="#c81e36" stroke-width=".9" stroke-linejoin="round"/><ellipse cx="21" cy="12" rx="18" ry="3.9" fill="url(#diyaRim)"/><ellipse cx="21" cy="12.4" rx="15.4" ry="2.6" fill="#3a1305"/><ellipse cx="16" cy="11.9" rx="5" ry=".8" fill="#ffcc80" opacity=".35"/><path d="M43.5 12.8Q48.5 11.2 52.4 9.3" stroke="#2a1206" stroke-width="1.7" stroke-linecap="round"/><circle cx="52.6" cy="9.2" r="1" fill="#ffb347"/></svg></button>
        <button class="diya-btn" aria-label="Light diya 4"><span class="halo"></span><span class="flame-wrap"><i class="flame" style="--d:-.2s"></i></span><svg class="diya" viewBox="0 0 56 30" aria-hidden="true"><ellipse cx="26" cy="28.6" rx="20" ry="1.5" fill="#000" opacity=".35"/><path d="M3 12Q3.5 26 24 27.6Q40 28.3 47.5 18.6L55 8.6Q46.5 12.8 38.5 12Z" fill="url(#diyaClay)"/><path d="M5 16Q8 25 24 26.4Q38 27 45 19" fill="none" stroke="#5a1f08" stroke-width="1" opacity=".45"/><path d="M7 17.6Q22 23.2 41 17.2" fill="none" stroke="#ffd166" stroke-width="1"/><circle cx="8.7" cy="18.2" r="0.8" fill="#ffd166"/><circle cx="12.1" cy="19.1" r="1.05" fill="#fff3d6"/><circle cx="15.6" cy="19.8" r="0.8" fill="#ffd166"/><circle cx="19.3" cy="20.2" r="1.05" fill="#fff3d6"/><circle cx="23.0" cy="20.3" r="0.8" fill="#ffd166"/><circle cx="26.8" cy="20.1" r="1.05" fill="#fff3d6"/><circle cx="30.8" cy="19.6" r="0.8" fill="#ffd166"/><circle cx="34.8" cy="18.9" r="1.05" fill="#fff3d6"/><circle cx="38.9" cy="17.8" r="0.8" fill="#ffd166"/><path d="M8.5 20.6L11.6 22.8L14.7 20.7L17.8 23.1L20.9 21.0L24.0 23.2L27.1 21.1L30.2 23.3L33.3 21.1L36.4 23.3L39.5 21.1" fill="none" stroke="#c81e36" stroke-width=".9" stroke-linejoin="round"/><ellipse cx="21" cy="12" rx="18" ry="3.9" fill="url(#diyaRim)"/><ellipse cx="21" cy="12.4" rx="15.4" ry="2.6" fill="#3a1305"/><ellipse cx="16" cy="11.9" rx="5" ry=".8" fill="#ffcc80" opacity=".35"/><path d="M43.5 12.8Q48.5 11.2 52.4 9.3" stroke="#2a1206" stroke-width="1.7" stroke-linecap="round"/><circle cx="52.6" cy="9.2" r="1" fill="#ffb347"/></svg></button>
        <button class="diya-btn" aria-label="Light diya 5"><span class="halo"></span><span class="flame-wrap"><i class="flame" style="--d:-.7s"></i></span><svg class="diya" viewBox="0 0 56 30" aria-hidden="true"><ellipse cx="26" cy="28.6" rx="20" ry="1.5" fill="#000" opacity=".35"/><path d="M3 12Q3.5 26 24 27.6Q40 28.3 47.5 18.6L55 8.6Q46.5 12.8 38.5 12Z" fill="url(#diyaClay)"/><path d="M5 16Q8 25 24 26.4Q38 27 45 19" fill="none" stroke="#5a1f08" stroke-width="1" opacity=".45"/><path d="M7 17.6Q22 23.2 41 17.2" fill="none" stroke="#ffd166" stroke-width="1"/><circle cx="8.7" cy="18.2" r="0.8" fill="#ffd166"/><circle cx="12.1" cy="19.1" r="1.05" fill="#fff3d6"/><circle cx="15.6" cy="19.8" r="0.8" fill="#ffd166"/><circle cx="19.3" cy="20.2" r="1.05" fill="#fff3d6"/><circle cx="23.0" cy="20.3" r="0.8" fill="#ffd166"/><circle cx="26.8" cy="20.1" r="1.05" fill="#fff3d6"/><circle cx="30.8" cy="19.6" r="0.8" fill="#ffd166"/><circle cx="34.8" cy="18.9" r="1.05" fill="#fff3d6"/><circle cx="38.9" cy="17.8" r="0.8" fill="#ffd166"/><path d="M8.5 20.6L11.6 22.8L14.7 20.7L17.8 23.1L20.9 21.0L24.0 23.2L27.1 21.1L30.2 23.3L33.3 21.1L36.4 23.3L39.5 21.1" fill="none" stroke="#c81e36" stroke-width=".9" stroke-linejoin="round"/><ellipse cx="21" cy="12" rx="18" ry="3.9" fill="url(#diyaRim)"/><ellipse cx="21" cy="12.4" rx="15.4" ry="2.6" fill="#3a1305"/><ellipse cx="16" cy="11.9" rx="5" ry=".8" fill="#ffcc80" opacity=".35"/><path d="M43.5 12.8Q48.5 11.2 52.4 9.3" stroke="#2a1206" stroke-width="1.7" stroke-linecap="round"/><circle cx="52.6" cy="9.2" r="1" fill="#ffb347"/></svg></button>
      </div>
      <button class="again reveal" id="again" aria-label="Choose again">↺</button>
    </section>
  </main>

  <script type="module" src="/src/chennai/main.js"></script>
</body>
</html>
