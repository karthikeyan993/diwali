<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0620">
  <meta name="description" content="A Diwali surprise for Dishanth and Pravya">
  <title>Happy Diwali</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪔</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;800&family=Outfit:wght@400;500;600&family=Yatra+One&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Sky: one canvas for beams/bokeh/stars, then the Chennai skyline and the mango-leaf toran -->
  <div id="world" aria-hidden="true">
    <canvas id="sky"></canvas>
    <div id="skyline"></div>
    <div id="toran"></div>
    <!-- the city starts in darkness; lighting the rocket lifts this veil -->
    <div id="veil"></div>
  </div>

  <!-- WebGL fireworks (PixiJS) -->
  <div id="fx"></div>

  <button class="sound" id="sound" aria-label="Mute sound" aria-pressed="false">🔊</button>

  <main>
    <section id="chooser" class="screen">
      <h1 class="title" id="title">Who are you?</h1>
      <div class="players">
        <button class="player" data-name="Dishanth" style="--n:0;--silk:#0f7b83;--silk2:#073b47;--c1:#ffd166;--c2:#2ee6d6">
          <span class="p-diya" aria-hidden="true"><i class="p-flame"></i><i class="p-bowl"></i></span>
          <span class="p-text"><span class="p-name">Dishanth</span><span class="p-sub" aria-hidden="true">Tap to light the sky</span></span>
          <span class="p-go" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>
        <button class="player" data-name="Pravya" style="--n:1;--silk:#b0175a;--silk2:#5a0830;--c1:#ffd166;--c2:#ff5fa8">
          <span class="p-diya" aria-hidden="true"><i class="p-flame"></i><i class="p-bowl"></i></span>
          <span class="p-text"><span class="p-name">Pravya</span><span class="p-sub" aria-hidden="true">Tap to light the sky</span></span>
          <span class="p-go" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>
      </div>
    </section>

    <section id="greet" class="screen hidden" aria-live="polite">
      <div class="score reveal" id="score" aria-label="Crackers burst"><span>🧨</span> <b id="score-n">0</b></div>
      <p class="g-top" id="g-top"></p>
      <h2 class="g-name" id="g-name"></h2>
      <p class="g-hint reveal" id="g-hint">&nbsp;</p>
      <!-- Diya mini-game -->
      <div class="diyas reveal" id="diyas">
        <button class="diya-btn" aria-label="Light diya 1"><span class="halo"></span><span class="flame-wrap"><i class="flame" style="--d:0s"></i></span><span class="diya"></span></button>
        <button class="diya-btn" aria-label="Light diya 2"><span class="halo"></span><span class="flame-wrap"><i class="flame" style="--d:-.4s"></i></span><span class="diya"></span></button>
        <button class="diya-btn" aria-label="Light diya 3"><span class="halo"></span><span class="flame-wrap"><i class="flame" style="--d:-.9s"></i></span><span class="diya"></span></button>
        <button class="diya-btn" aria-label="Light diya 4"><span class="halo"></span><span class="flame-wrap"><i class="flame" style="--d:-.2s"></i></span><span class="diya"></span></button>
        <button class="diya-btn" aria-label="Light diya 5"><span class="halo"></span><span class="flame-wrap"><i class="flame" style="--d:-.7s"></i></span><span class="diya"></span></button>
      </div>
      <button class="again reveal" id="again" aria-label="Choose again">↺</button>
    </section>
  </main>

  <script type="module" src="/src/chennai/main.js"></script>
</body>
</html>
